<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./ui.css">
  </head>
  <body>
    <h2>Chopstick Icon Export</h2>
    <p>Select icons and brand variants to include in your export.</p>

    <div class="source-tabs">
      <button id="tab-page" class="source-tab active" type="button">Page</button>
      <button id="tab-selection" class="source-tab" type="button">Selection</button>
    </div>

    <div id="loading">Scanning...</div>
    <div id="empty-state" class="hidden">No icons found.</div>

    <div id="panels" class="hidden">
      <div class="toolbar">
        <div class="toggle-actions">
          <button class="toggle-btn" data-action="select-all-icons" type="button">Select all</button>
          <button class="toggle-btn" data-action="deselect-all-icons" type="button">Deselect all</button>
        </div>
        <div class="brand-dropdown">
          <button id="brand-dropdown-btn" type="button">Brands</button>
          <div id="brand-dropdown-menu" class="brand-dropdown-menu hidden"></div>
        </div>
      </div>

      <div class="search-bar">
        <input id="search" type="text" placeholder="Search icons...">
      </div>

      <div id="icon-list" class="icon-list"></div>
    </div>

    <button id="exportBtn" disabled>Export icons</button>
    <div id="status"></div>

    <script type="module" src="./ui.ts"></script>
  </body>
</html>
